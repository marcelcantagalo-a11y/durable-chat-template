<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Fight V9</title>

<style>
/* =========================================
   V10.2 - ARENA VIVA
========================================= */

const characterImages = {

    "TANK":"tank.png",
    "WARRIOR":"warrior.png",
    "ARCHER":"archer.png",
    "MAGE":"mage.png",
    "PRIEST":"priest.png"

};

@keyframes heroIdle {

    0%, 100% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-4px);
    }

}

.player {
    animation: heroIdle 1.8s ease-in-out infinite;
}

.player .playerClass {
    /* Keep class label unchanged */
}

.player.priest {
    animation: none;
}


@keyframes bossIdle {

    0%, 100% {
        transform: translateY(0px) scale(1);
    }

    50% {
        transform: translateY(-7px) scale(1.03);
    }

}

.boss {
    animation: bossIdle 2s ease-in-out infinite;
}


@keyframes battleShake {

    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(-3px,2px);
    }

    50% {
        transform: translate(3px,-2px);
    }

    75% {
        transform: translate(-2px,-1px);
    }

    100% {
        transform: translate(0,0);
    }

}

.player.battleHit {
    animation: battleShake .25s ease;
}


@keyframes magicAura {

    0%,100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.35)
                drop-shadow(0 0 8px #9d4edd);
    }

}

.player.magicAura {
    animation: magicAura 1.2s infinite;
}


@keyframes healerAura {

    0%,100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.4)
                drop-shadow(0 0 10px #4dff88);
    }

}

.player.healerAura {
    animation: healerAura 1.4s infinite;
}
.projectile{
    position:fixed;
    z-index:9999;
    pointer-events:none;

    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        left .55s ease-out,
        top .55s ease-out;
}
.tauntSkill{
    position:fixed;
    z-index:10000;
    pointer-events:none;

    font-size:28px;
    font-weight:900;
    color:#fff;

    white-space:nowrap;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffb300,
        0 0 25px #ff6a00;

    transition:
        left .8s ease-out,
        top .8s ease-out,
        transform .8s ease-out,
        opacity .8s ease-out;

    transform:scale(.7);
    opacity:0;
}
.skillAnnouncement{
    position:fixed;
    z-index:10000;
    pointer-events:none;

    left:50%;
    top:35%;

    transform:translate(-50%,-50%);

    font-size:30px;
    font-weight:900;
    text-align:center;
    white-space:nowrap;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 12px #ffb300,
        0 0 25px #ff6a00;

    animation:skillAnnouncementAnim 1.8s ease-out forwards;
}

@keyframes skillAnnouncementAnim{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.5);
    }

    15%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.2);
    }

    70%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.15);
    }

}
.projectile.arrow{

    font-size:42px;

    filter:none;

    animation:
        arrowProjectile
        .18s
        linear
        infinite
        alternate;
}


@keyframes arrowProjectile{

    from{

        transform:
            scale(.85)
            rotate(-5deg);

        opacity:.85;
    }

    to{

        transform:
            scale(1.15)
            rotate(5deg);

        opacity:1;
    }

}

.projectile.fire{
    font-size:42px;
    filter:
        drop-shadow(0 0 6px white)
        drop-shadow(0 0 15px orange)
        drop-shadow(0 0 25px red);
}

.projectile.magic{
    animation:magicProjectile .2s infinite alternate;
}

@keyframes magicProjectile{

    from{
        transform:scale(.9);
    }

    to{
        transform:scale(1.3);
    }

}
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050814;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
}

.game{
    width:420px;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#171d45 0%,#080b18 45%,#03050c 100%);
    padding:10px;
    overflow:hidden;
}

/* =========================
   TOPO
========================= */

.title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:0;
}

.subtitle{
    text-align:center;
    color:#aaa;
    font-size:10px;
    letter-spacing:1.5px;
}

.bossLevel{
    text-align:center;
    color:#ffd21c;
    font-size:15px;
    font-weight:bold;
    margin:3px 0;
}

.bossName{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:3px;
}

.boss{

    width:95px;

    height:95px;

    margin:2px auto;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:58px;

    border-radius:50%;

    background:radial-gradient(circle,#38105f,#120a27);

    border:2px solid #9d4edd;

    box-shadow:0 0 20px #7b2cbf;

    transition:.2s;

}

.boss.rage{

    animation:rage .5s infinite alternate;

    border-color:#ff2020;

    box-shadow:0 0 30px red;

}

@keyframes rage{

    from{transform:scale(1);}

    to{transform:scale(1.05);}

}

.hpContainer{

    margin:2px 3px 5px;

}

.hpBar{

    width:100%;

    height:16px;

    background:#242424;

    border:2px solid #555;

    border-radius:12px;

    overflow:hidden;

}

.hpFill{

    height:100%;

    width:100%;

    background:linear-gradient(90deg,#00c853,#76ff03);

    transition:.25s;

}

.hpText{

    text-align:center;

    font-size:10px;

    margin-top:2px;

}

/* =========================
   EVENTO
========================= */

.eventBox{
    min-height:38px;
    background:#101528;
    border:1px solid #30395c;
    border-radius:8px;
    padding:8px;
    text-align:center;
    font-size:12px;
    margin-bottom:8px;
}

/* =========================
   FORMATION
========================= */

.formationTitle{
    text-align:center;
    font-size:12px;
    color:#aaa;
    margin:4px 0;
}

.players{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
}

.rowTitle{
    grid-column:1/-1;
    font-size:8px;
    color:#aaa;
    text-align:left;
    padding-left:3px;
    margin-top:1px;
    margin-bottom:1px;
}

/* =========================
   PLAYER
========================= */

.player{
    background:#0e1325;
    border:1px solid #252d49;
    border-radius:6px;
    padding:2px 1px;
    text-align:center;
    min-height:82px;
    position:relative;
    transition:.2s;
}

.player:hover{
    transform:translateY(-2px);
}

.playerIcon{

    height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

}

.playerIcon img{

    width:55px;

    height:55px;

    object-fit:contain;

    display:block;

}

.playerName{
    font-size:8px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.playerLevel{
    font-size:7px;
    color:#ffd21c;
    margin-top:2px;
}

.playerHp{
    height:4px;
    background:#272727;
    border-radius:5px;
    overflow:hidden;
    margin:3px 1px 1px;
}

.playerHpFill{
    height:100%;
    background:#00d26a;
}

.playerXp{
    height:2px;
    background:#252525;
    border-radius:4px;
    overflow:hidden;
}

.playerXpFill{
    height:100%;
    background:#ffd600;
}

.dead{
    opacity:.35;
    filter:grayscale(1);
}

/* =========================
   PAINEIS
========================= */

.panelGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    margin-top:8px;
}

.panel{
    background:#0c1121;
    border:1px solid #293252;
    border-radius:8px;
    padding:7px;
}

.panelTitle{
    color:#ffd21c;
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
}

.panelText{
    font-size:9px;
    line-height:1.5;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
    margin-top:6px;
}

.stat{
    background:#11172b;
    border:1px solid #293252;
    border-radius:7px;
    padding:6px 2px;
    text-align:center;
}

.statNumber{
    font-size:17px;
    font-weight:bold;
    color:#ffd21c;
}

.statLabel{
    font-size:7px;
    color:#aaa;
}

/* =========================
   VITORIA
========================= */

.victory{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.85);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:20;

}

.victory.active{

    display:flex;

}

.victoryBox{

    width:340px;
    max-width:90vw;

    background:
        radial-gradient(
            circle at top,
            #20284a 0%,
            #11162b 55%,
            #080b17 100%
        );

    border:2px solid #ffd21c;

    border-radius:18px;

    padding:24px 20px 22px;

    text-align:center;

    box-shadow:
        0 0 25px rgba(255,210,28,.35),
        0 0 60px rgba(255,210,28,.12);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

}
.victoryTrophy{

    font-size:70px;

    line-height:1;

    margin-bottom:8px;

    filter:
        drop-shadow(0 0 8px #ffd21c)
        drop-shadow(0 0 18px rgba(255,210,28,.6));

}

.victoryTitle{

    font-size:28px;

    line-height:1.1;

    color:#ffd21c;

    font-weight:900;

    letter-spacing:.5px;

    margin:0 0 16px;

    text-shadow:
        0 0 6px rgba(255,210,28,.7),
        0 0 14px rgba(255,210,28,.35);

}


.victoryBoss{

    font-size:78px;

    line-height:1;

    margin:2px 0 10px;

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,.35));

}


.victoryText{

    font-size:18px;

    line-height:1.35;

    font-weight:900;

    color:#fff;

    margin-top:4px;

    text-shadow:
        0 2px 5px #000;

}


/* =====================================
   💀 GAME OVER SCREEN
===================================== */

.victory.gameOver
.victoryBox{

    background:
        radial-gradient(
            circle at center,
            #2a0505 0%,
            #120000 55%,
            #070707 100%
        );

    border:3px solid #ff2020;

    box-shadow:
        0 0 20px #ff2020,
        0 0 50px rgba(255,0,0,.7),
        inset 0 0 35px rgba(255,0,0,.25);

    animation:gameOverPulse 1.2s infinite alternate;

}


.victory.gameOver .victoryTitle{

    color:#ff3030;

    font-size:34px;

    font-weight:900;

    text-shadow:
        0 0 8px #ff0000,
        0 0 20px rgba(255,0,0,.8);

}


.victory.gameOver .victoryBoss{

    font-size:90px;

    margin:16px 0;

    filter:
        drop-shadow(0 0 8px #ff0000)
        drop-shadow(0 0 18px rgba(255,0,0,.8));

}


.victory.gameOver #victoryText{

    color:#fff;

    font-size:20px;

    font-weight:bold;

}


@keyframes gameOverPulse{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.025);
    }

}
/* =========================
   FLASH
========================= */

.flash{
    position:fixed;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:30;
}

.flash.active{
    animation:flash .4s;
}

@keyframes flash{
    0%{opacity:.8}
    100%{opacity:0}
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:430px){
    .game{
        width:100%;
    }
}
/* =========================================
   ANIMATIONS V9.1
========================================= */

@keyframes attack{

    0%{
        transform:translateX(0) scale(1);
    }

    40%{
        transform:translateX(8px) scale(1.08);
    }

    100%{
        transform:translateX(0) scale(1);
    }

}

.player.attacking{
    animation:attack .35s ease;
}


@keyframes tankAttack{

    0%{
        transform:translateX(0);
    }

    40%{
        transform:translateX(10px) rotate(-5deg);
    }

    100%{
        transform:translateX(0);
    }

}

.player.tankAttack{
    animation:tankAttack .4s ease;
}


@keyframes assassinAttack{

    0%{
        transform:translateX(0);
    }

    35%{
        transform:translateX(18px) scale(1.15);
    }

    100%{
        transform:translateX(0);
    }

}

.player.assassinAttack{
    animation:assassinAttack .3s ease;
}


@keyframes mageAttack{

    0%{
        transform:scale(1);
        filter:brightness(1);
    }

    50%{
        transform:scale(1.18);
        filter:brightness(1.5);
    }

    100%{
        transform:scale(1);
        filter:brightness(1);
    }

}

.player.mageAttack{
    animation:mageAttack .5s ease;
}


@keyframes archerAttack{

    0%{
        transform:translateX(0);
    }

    45%{
        transform:translateX(6px) rotate(3deg);
    }

    100%{
        transform:translateX(0);
    }

}

.player.archerAttack{
    animation:archerAttack .3s ease;
}


@keyframes healerCast{

    0%{
        transform:scale(1);
        filter:brightness(1);
    }

    50%{
        transform:scale(1.15);
        filter:brightness(1.6);
    }

    100%{
        transform:scale(1);
        filter:brightness(1);
    }

}

.player.healerCast{
    animation:healerCast .6s ease;
}


@keyframes bossHit{

    0%{
        transform:scale(1);
    }

    25%{
        transform:translateX(-5px) scale(1.05);
    }

    50%{
        transform:translateX(5px) scale(1.05);
    }

    75%{
        transform:translateX(-3px);
    }

    100%{
        transform:scale(1);
    }

}

.boss.hit{
    animation:bossHit .25s ease;
}


@keyframes floatingDamage{

    0%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

    100%{
        opacity:0;
        transform:translateY(-35px) scale(1.25);
    }

}

.damageNumber{

    position:fixed;
    pointer-events:none;
    z-index:50;

    color:#ff4d4d;

    font-size:18px;
    font-weight:bold;

    text-shadow:
        0 2px 4px black;

    animation:floatingDamage .8s ease forwards;

}


.healNumber{

    color:#4dff88;

}


@keyframes deathAnim{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(.8) rotate(-5deg);
    }

    100%{
        transform:scale(.7);
    }

}

.player.dead{
    animation:none !important;
}


@keyframes healAura{

    0%{
        box-shadow:0 0 0 rgba(80,255,150,0);
    }

    50%{
        box-shadow:0 0 18px rgba(80,255,150,.8);
    }

    100%{
        box-shadow:0 0 0 rgba(80,255,150,0);
    }

}

.player.healing{
    animation:healAura .7s ease;
}


@keyframes idle{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-2px);
    }

}

.playerIcon{
    animation:idle 2.5s ease-in-out infinite;
}
.player.dead .playerIcon{
    animation:none !important;
}
/* =========================================
   V11 - BOSS SPELLS AND PROJECTILES
========================================= */

.bossProjectile{
    position:fixed;
    z-index:120;
    pointer-events:none;
    font-size:32px;
    transition:all .5s cubic-bezier(.2,.8,.3,1);
    filter:drop-shadow(0 0 10px white);
}

.fireball{
    animation:fireSpin .35s linear infinite;
}

@keyframes fireSpin{
    from{
        transform:rotate(0deg) scale(1);
    }
    to{
        transform:rotate(360deg) scale(1.15);
    }
}

.lightningProjectile{
    font-size:38px;
    animation:lightningPulse .12s infinite alternate;
}

@keyframes lightningPulse{
    from{
        transform:scale(1);
        filter:brightness(1);
    }
    to{
        transform:scale(1.35);
        filter:brightness(2);
    }
}

.shadowProjectile{
    font-size:34px;
    animation:shadowPulse .3s infinite alternate;
}

@keyframes shadowPulse{
    from{
        transform:scale(.9);
    }
    to{
        transform:scale(1.25);
    }
}


/* Impact */

.skillImpact{
    position:fixed;
    z-index:130;
    pointer-events:none;
    font-size:42px;
    animation:impact .5s ease forwards;
}

@keyframes impact{

    0%{
        opacity:1;
        transform:scale(.4);
    }

    50%{
        opacity:1;
        transform:scale(1.4);
    }

    100%{
        opacity:0;
        transform:scale(1.8);
    }

}


/* Explosion area */

.areaExplosion{
    position:fixed;
    z-index:110;
    width:100px;
    height:100px;
    border:3px solid #b56cff;
    border-radius:50%;
    pointer-events:none;
    animation:areaBoom .55s ease forwards;
}

@keyframes areaBoom{

    0%{
        opacity:.9;
        transform:scale(.2);
        box-shadow:0 0 10px #b56cff;
    }

    100%{
        opacity:0;
        transform:scale(1.7);
        box-shadow:0 0 45px #b56cff;
    }

}
/* =========================================
   SPECIAL ABILITIES
========================================= */

.skillEffect{
    position:fixed;
    z-index:10000;
    pointer-events:none;
    font-size:45px;
    animation:skillPop .8s ease-out forwards;
}

@keyframes skillPop{

    0%{
        opacity:0;
        transform:scale(.3);
    }

    30%{
        opacity:1;
        transform:scale(1.4);
    }

    100%{
        opacity:0;
        transform:scale(2);
    }

}


/* TAUNT */

.tauntAura{
    animation:tauntPulse .5s infinite alternate !important;
    position:relative;
}


.tauntShield{

    position:absolute;

    left:50%;
    top:50%;

    width:70px;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    transform:
        translate(-50%,-50%);

    z-index:10;

    pointer-events:none;

    font-size:65px;

    filter:
        drop-shadow(0 0 8px #ffd000)
        drop-shadow(0 0 20px #ff7300)
        drop-shadow(0 0 35px #ff3300);

    animation:
        tauntShieldAnimation
        .7s
        ease-in-out
        infinite
        alternate;
}


@keyframes tauntShieldAnimation{

    from{

        transform:
            translate(-50%, -50%)
            scale(.85);

        opacity:.75;

    }

    to{

        transform:
            translate(-50%, -50%)
            scale(1.15);

        opacity:1;

    }

}


@keyframes tauntPulse{

    from{

        box-shadow:
            0 0 8px #ffd000;
    }

    to{

        box-shadow:
            0 0 25px #ffd000,
            0 0 45px #ff7300;
    }

}

@keyframes tauntShieldAnimation{

    from{

        transform:
            translate(-50%,-50%)
            scale(.85);

        opacity:.75;
    }

    to{

        transform:
            translate(-50%,-50%)
            scale(1.2);

        opacity:1;
    }

}

    from{

        transform:
            translate(-50%,-50%)
            scale(.9);

        opacity:.8;
    }

    to{

        transform:
            translate(-50%,-50%)
            scale(1.2);

        opacity:1;
    }

}

@keyframes tauntPulse{

    from{
        box-shadow:
            0 0 8px #ffd000;
    }

    to{
        box-shadow:
            0 0 25px #ffd000,
            0 0 45px #ff7300;
    }

}

@keyframes shieldPulse{

    from{
        transform:
            translate(-50%,-50%)
            scale(.85);
        opacity:.75;
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1.15);
        opacity:1;
    }

}

/* METEOR */

.meteorEffect{

    position:fixed;

    z-index:10001;

    pointer-events:none;

    font-size:60px;

    transition:
        top .7s cubic-bezier(.2,.8,.3,1);

    filter:
        drop-shadow(0 0 8px #ff6a00)
        drop-shadow(0 0 18px red)
        drop-shadow(0 0 30px #ffd000);

    animation:
        meteorGlow
        .25s
        infinite
        alternate;
}


@keyframes meteorGlow{

    from{

        transform:scale(.9);

    }

    to{

        transform:scale(1.15);

    }

}


/* ARROW RAIN */

.arrowRain{
    position:fixed;
    z-index:10000;
    pointer-events:none;
    font-size:30px;
    animation:arrowFall .5s linear forwards;
}

@keyframes arrowFall{

    from{
        transform:translateY(-100px) rotate(20deg);
        opacity:0;
    }

    30%{
        opacity:1;
    }

    to{
        transform:translateY(100px) rotate(20deg);
        opacity:0;
    }

function initAudio(){

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }

}

function playSkillSound(skillText){

    initAudio();


    const now =
        audioContext.currentTime;


    /* =====================================
       🛡️ TAUNT
    ===================================== */

    if(skillText === "TAUNT"){

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "square";


        oscillator.frequency.setValueAtTime(
            180,
            now
        );


        oscillator.frequency.exponentialRampToValueAtTime(
            90,
            now + 0.18
        );


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            0.35,
            now + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.20
        );


        oscillator.connect(gain);
        gain.connect(audioContext.destination);


        oscillator.start(now);
        oscillator.stop(now + 0.20);


        return;

    }


    /* =====================================
       ⚔️ HEAVY STRIKE
    ===================================== */

    if(skillText === "HEAVY STRIKE"){

        const oscillator =
            audioContext.createOscillator();

    if(skillText === "EXECUTION"){

        const oscillator =
            audioContext.createOscillator();

        );


        oscillator.connect(gain);

        oscillator.start(now);
        oscillator.stop(now + 0.20);

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.frequency.setValueAtTime(

/* ============================================================
   BOSS GENERATOR

function generateBoss(level){

    /*
       Use the same index so the Boss name
       and icon always match.
    */

    const bossIndex =
        Math.floor(
            Math.random() *
            bossNames.length
        );

    const name =
        bossNames[bossIndex];

    const icon =
        bossIcons[bossIndex];

    /*
       Boss HP scaling.

       Early Bosses:
       Easier progression.

       Later Bosses:
       Much stronger exponential growth.
    */

    let hp;

    if(level <= 10){

        hp =
            Math.floor(
                7000 *
                Math.pow(
                    1.15,
                    level - 1
                )
            );

    }
    else if(level <= 20){

        hp =
            Math.floor(
                27000 *
                Math.pow(
                    1.18,
                    level - 10
                )
            );

    }
    else if(level <= 30){

        hp =
            Math.floor(
                165000 *
                Math.pow(
                    1.21,
                    level - 20
                )
            );

    }
    else{

        hp =
            Math.floor(
                1185000 *
                Math.pow(
                    1.24,
                    level - 30
                )
            );

    }

    /*
       Every 10 Bosses:
       Special Boss gets +50% HP.
    */

    const special =
        level % 10 === 0;

    if(special){

        hp =
            Math.floor(
                hp * 1.5
            );

    }

    return {

        name:name,
        icon:icon,
        hp:hp,
        special:special

    };

}

                    remotePlayer.hp ??

                alive:
                    remotePlayer.alive ??
                    true,

                totalDamage:
                    remotePlayer.totalDamage ||
                    0,

                healing:
                    remotePlayer.healing ||
                    0

            };


            players.push(
                remotePlayerObject
            );


            createPlayerUI(
                remotePlayerObject
            );


            addEvent(
                remotePlayerObject.icon +
                " " +
                remotePlayerObject.name +
                " joined!"
            );

        }
    );


    update();

}


        /* =====================================
           ⚔️ NOVO JOGADOR ENTROU
        ===================================== */

        else if(data.type === "playerJoined"){

            const remotePlayer =
                data.player;


            const alreadyExists =
                players.some(
                    player =>
                        player.remoteId ===
                        remotePlayer.id
                );


            if(alreadyExists){
                return;
            }


            const classData =
                classes.find(
                    c =>
                        c.name ===
                        remotePlayer.class
                );


            if(!classData){
                return;
            }


            const newRemotePlayer = {

                id:
                    nextPlayerId++,

                remoteId:
                    remotePlayer.id,

                serverPosition:
                    remotePlayer.position,

                isAI:
                    remotePlayer.isAI === true,

                name:
                    remotePlayer.name,

                class:
                    remotePlayer.class,

                icon:
                    classIcons[
                        remotePlayer.class
                    ],

                damage:[
                    classData.damage[0],
                    classData.damage[1]
                ],

                speed:
                    classData.speed,

                level:1,

                xp:0,

                nextXp:100,

                maxHp:
                    classData.hp,

                hp:
                    classData.hp,

                alive:true,

                totalDamage:0,

                healing:0

            };


            players.push(
                newRemotePlayer
            );


            createPlayerUI(
                newRemotePlayer
            );


            eventBox.textContent =
                newRemotePlayer.icon +
                " " +
                newRemotePlayer.name +
                " joined the battle!";


            addEvent(
                newRemotePlayer.icon +
                " " +
                newRemotePlayer.name +
                " joined!"
            );


            update();

        }


        /* =====================================
           🔴 JOGADOR SAIU
        ===================================== */

        else if(data.type === "playerLeft"){

            const playerIndex =
                players.findIndex(
                    player =>
                        player.remoteId ===
                        data.playerId
                );


            if(playerIndex === -1){
                return;
            }


            const player =
                players[playerIndex];


            const element =
                document.getElementById(
                    "player-" + player.id
                );


            if(element){
                element.remove();
            }


            players.splice(
                playerIndex,
                1
            );


            addEvent(
                "🔴 " +
                player.name +
                " left the battle!"
            );


            update();

        }


        /* =====================================
           🔄 PLAYER UPDATED
        ===================================== */

        else if(data.type === "playerUpdated"){

            const remotePlayer =
                data.player;


            const localPlayer =
                players.find(
                    player =>
                        player.remoteId ===
                        remotePlayer.id
                );


            if(!localPlayer){
                return;
            }


            Object.assign(
                localPlayer,
                remotePlayer
            );


            update();

        }


        /* =====================================
           ⚔️ RESULTADO DO ATAQUE
        ===================================== */

        else if(data.type === "attackResult"){

            /*
               Procura o jogador que realizou
               o ataque.
            */

            const attackingPlayer =
                players.find(
                    player =>
                        player.remoteId ===
                        data.playerId
                );


            if(!attackingPlayer){
                return;
            }


            /* =====================================
               🎯 ATUALIZA BOSS OFICIAL
            ===================================== */

            bossHp =
                data.bossHp;


            maxBossHp =
                data.maxBossHp;


            /* =====================================
               💥 MISS
            ===================================== */

            if(!data.hit){

                const bossRect =
                    bossElement.getBoundingClientRect();


                const missText =
                    document.createElement(
                        "div"
                    );


                missText.textContent =
                    "MISS";


                missText.style.position =
                    "fixed";


                missText.style.left =
                    (
                        bossRect.left +
                        bossRect.width / 2 -
                        25
                    ) + "px";


                missText.style.top =
                    (
                        bossRect.top +
                        bossRect.height / 2 -
                        35
                    ) + "px";


                missText.style.color =
                    "#aaaaaa";


                missText.style.fontSize =
                    "18px";


                missText.style.fontWeight =
                    "900";


                missText.style.textShadow =
                    "0 1px 3px #000";


                missText.style.zIndex =
                    "9999";


                missText.style.pointerEvents =
                    "none";


                document.body.appendChild(
                    missText
                );


                eventBox.textContent =
                    attackingPlayer.name +
                    " missed the attack";


                addEvent(
                    attackingPlayer.name +
                    " missed the attack"
                );


                const missSound =
                    new Audio(
                        "miss.mp3"
                    );


                missSound.volume =
                    0.7;


                missSound.play()
                    .catch(()=>{});


                setTimeout(
                    () => {

                        missText.remove();

                    },
                    700
                );


                update();


                return;

            }


            /* =====================================
               💥 ATUALIZA DANO DO JOGADOR
            ===================================== */

            attackingPlayer.totalDamage =
                data.totalDamage;


            /*
               Mantém o nível informado
               pelo servidor.
            */

            if(
                typeof data.level ===
                "number"
            ){

                attackingPlayer.level =
                    data.level;

            }


            /* =====================================
               🚀 PROJECTILE
            ===================================== */

            launchProjectile(
                attackingPlayer
            );


            /* =====================================
               ⭐ CRITICAL
            ===================================== */

            if(data.critical){

                eventBox.textContent =
                    "💥 CRITICAL! " +
                    attackingPlayer.name +
                    " dealt " +
                    data.damage.toLocaleString(
                        "en-US"
                    ) +
                    " damage!";


            }

            else{

                eventBox.textContent =
                    attackingPlayer.icon +
                    " " +
                    attackingPlayer.name +
                    " dealt " +
                    data.damage.toLocaleString(
                        "en-US"
                    ) +
                    " damage!";

            }


            addEvent(
                attackingPlayer.name +
                " dealt " +
                data.damage.toLocaleString(
                    "en-US"
                ) +
                " damage!"
            );


            /* =====================================
               ⚔️ ATTACK ANIMATION
            ===================================== */

            const attackingElement =
                document.getElementById(
                    "player-" +
                    attackingPlayer.id
                );


            if(attackingElement){

                attackingElement.classList.add(
                    "attacking"
                );


                setTimeout(
                    () => {

                        attackingElement.classList.remove(
                            "attacking"
                        );

                    },
                    350
                );

            }


            /* =====================================
               UPDATE
            ===================================== */

            update();

        }

        /* =====================================
           👹 ATAQUE OFICIAL DO BOSS
           O Worker já decidiu alvo, dano e HP.
        ===================================== */

        else if(data.type === "bossAttackResult"){

            const targetPlayer =
                players.find(
                    player =>
                        player.remoteId ===
                        data.targetId
                );

            if(!targetPlayer){
                return;
            }

            const wasAlive = targetPlayer.alive;

            targetPlayer.hp = data.hp;
            targetPlayer.maxHp = data.maxHp;
            targetPlayer.alive = data.alive;

            const bossHitSound =
                new Audio("golpeboss.mp3");

            bossHitSound.volume = 0.9;

            bossHitSound.play()
                .catch(()=>{});

            if(wasAlive && !targetPlayer.alive){

                /*
                   A morte oficial vem do Worker.
                   O fluxo único de morte/Game Over
                   passa pelo killPlayer().
                */

                targetPlayer.alive = true;
                targetPlayer.hp = targetPlayer.maxHp;

                killPlayer(targetPlayer);

            }

            const targetElement =
                document.getElementById(
                    "player-" + targetPlayer.id
                );

            if(targetElement){

                targetElement.classList.add(
                    "battleHit"
                );

                setTimeout(() => {
                    targetElement.classList.remove(
                        "battleHit"
                    );
                },250);

                const rect =
                    targetElement.getBoundingClientRect();

                const damageText =
                    document.createElement("div");

                damageText.className =
                    "bossDamageNumber";

                damageText.textContent =
                    "-" + data.damage;

                damageText.style.left =
                    (rect.left + rect.width / 2) + "px";

                damageText.style.top =
                    (rect.top + rect.height / 2) + "px";

                document.body.appendChild(damageText);

                setTimeout(() => {
                    damageText.remove();
                },800);

            }

            eventBox.textContent =
                data.spellIcon +
                " " +
                data.spellName +
                "! " +
                targetPlayer.name +
                " lost " +
                data.damage +
                " HP";

            addEvent(
                data.spellIcon +
                " " +
                data.spellName +
                " hit " +
                targetPlayer.name
            );

            update();

        }

        /* =====================================
           💚 CURA OFICIAL DO PRIEST
        ===================================== */

        else if(data.type === "healResult"){

            const healer =
                players.find(
                    player =>
                        player.remoteId ===
                        data.healerId
                );

            const target =
                players.find(
                    player =>
                        player.remoteId ===
                        data.targetId
                );

            if(!healer || !target){
                return;
            }

            target.hp = data.hp;
            target.maxHp = data.maxHp;
            target.alive = data.alive;
            healer.healing = data.healerHealing;

            const targetElement =
                document.getElementById(
                    "player-" + target.id
                );

            if(targetElement){

                targetElement.classList.add("healing");

                const rect =
                    targetElement.getBoundingClientRect();

                const healText =
                    document.createElement("div");

                healText.className =
                    "damageNumber healNumber";
                healText.textContent = "+" + data.heal + " HP";
                healText.style.left =
                    (rect.left + rect.width / 2) + "px";
                healText.style.top =
                    (rect.top + rect.height / 2) + "px";

                document.body.appendChild(healText);

                setTimeout(() => {
                    targetElement.classList.remove("healing");
                    healText.remove();
                },800);

            }

            const healerElement =
                document.getElementById(
                    "player-" + healer.id
                );

            if(healerElement){

                healerElement.classList.add("healerCast");

                setTimeout(() => {
                    healerElement.classList.remove("healerCast");
                },600);

            }

            eventBox.textContent =
                "💚 " +
                healer.name +
                " HEALED " +
                target.name +
                " FOR +" +
                data.heal +
                " HP";

            addEvent(eventBox.textContent);

            update();

        }

    }
    catch(error){

        console.error(
            "❌ MULTIPLAYER MESSAGE ERROR:",
            error
        );

    }

};

let eventHistory = [];


function addEvent(text){

    eventHistory.unshift(text);

    if(eventHistory.length > 5){

        eventHistory.pop();

    }

    eventsElement.innerHTML =
        eventHistory.join("<br>");

}


/* ============================================================
   CHOOSE CLASS
============================================================ */

function randomClass(){

    /*
       Priest has approximately a 15% chance.
    */

    if(Math.random() < 0.15){

        return classes.find(
            c => c.name === "PRIEST"
        );

    }

    /*
       The other 85% are distributed
       among Tank, Warrior, Archer and Mage.
    */

    const normalClasses =
        classes.filter(
            c => c.name !== "PRIEST" &&
                 c.name !== "ASSASSIN"
        );

    return normalClasses[
        Math.floor(
            Math.random() * normalClasses.length
        )
    ];

}


/* ============================================================
   CREATE PLAYER
============================================================ */

function createPlayer(){

    /* =====================================
       🎯 CLASSES DISPONÍVEIS
       Máximo de 5 jogadores por classe
    ===================================== */

    const availableClasses =
        classes.filter(playerClass => {

            const classCount =
                players.filter(
                    player =>
                        player.class === playerClass.name
                ).length;

            return classCount < 5;

        });


    /*
       Todas as classes já estão cheias.
    */

    if(availableClasses.length === 0){

        return;

    }


    /*
       Escolhe aleatoriamente somente
       entre as classes que ainda têm vaga.
    */

    const playerClass =
        availableClasses[
            Math.floor(
                Math.random() *
                availableClasses.length
            )
        ];


    /* =====================================
       👤 NOME ÚNICO
    ===================================== */

    const usedNames =
        new Set(
            players.map(
                player =>
                    player.name
            )
        );


    const availableNames =
        playerNames.filter(
            name =>
                !usedNames.has(name)
        );


    let playerName;


    if(availableNames.length > 0){

        playerName =
            availableNames[
                Math.floor(
                    Math.random() *
                    availableNames.length
                )
            ];

    }else{

        playerName =
            "Player" +
            nextPlayerId;

    }


    const player = {

        id:nextPlayerId++,


        name:
            playerName,


        class:
            playerClass.name,


        icon:
            classIcons[playerClass.name],


        damage:[
            playerClass.damage[0],
            playerClass.damage[1]
        ],


        speed:
            playerClass.speed,


        level:1,


        xp:0,


        nextXp:100,


        maxHp:
            playerClass.hp,


        hp:
            playerClass.hp,


        alive:true,


        totalDamage:0,


        healing:0

    };


    players.push(player);


    createPlayerUI(player);


    eventBox.textContent =
        player.icon +
        " " +
        player.name +
        " joined as " +
        player.class;


    addEvent(
        player.icon +
        " " +
        player.name +
        " joined!"
    );


    update();


    /* =====================================
       🌐 SEND PLAYER TO SERVER
    ===================================== */

    function sendPlayerToServer(){

        if(
            multiplayerSocket.readyState ===
            WebSocket.OPEN
        ){

            multiplayerSocket.send(
                JSON.stringify({

                    type:"join",

                    name:player.name,

                    class:player.class

                })
            );


            console.log(
                "⚔️ PLAYER SENT TO SERVER:",
                player.name,
                player.class
            );


            return;

        }


        /*
           Wait until WebSocket connects.
        */

        if(
            multiplayerSocket.readyState ===
            WebSocket.CONNECTING
        ){

            setTimeout(
                sendPlayerToServer,
                100
            );

        }

    }


    sendPlayerToServer();

}

function updatePlayerUI(player){

    const hp =
        document.getElementById(
            "hp-" + player.id
        );

    const xp =
        document.getElementById(
            "xp-" + player.id
        );

    const element =
        document.getElementById(
            "player-" + player.id
        );

    if(!hp || !xp || !element){

        return;

    }


    hp.style.width =
        Math.max(
            0,
            (player.hp/player.maxHp)*100
        ) + "%";


    xp.style.width =
        Math.min(
            100,
            (player.xp/player.nextXp)*100
        ) + "%";


    element.querySelector(
        ".playerLevel"
    ).textContent =
        "LV." + player.level;


    /* ❤️ HP AS A NUMBER */

    let hpText =
        element.querySelector(
            ".playerHpText"
        );


    if(!hpText){

        hpText =
            document.createElement("div");

        hpText.className =
            "playerHpText";

        element.querySelector(
            ".playerHp"
        ).after(hpText);

    }


    hpText.textContent =
        player.hp +
        " / " +
        player.maxHp;


    if(player.alive){

        element.classList.remove("dead");

    }else{

        element.classList.add("dead");

    }
    

}

/* ============================================================
   GAIN XP
============================================================ */

function gainXp(player,amount){

    player.xp += amount;


    while(
        player.xp >= player.nextXp
    ){

        player.xp -=
            player.nextXp;


        player.level++;


        player.nextXp =
            Math.floor(
                100 *
                Math.pow(
                    1.30,
                    player.level - 1
                )
            );


        /* =====================================
           📈 CLASS PROGRESSION
        ===================================== */

        let hpGrowth = 0;
        let damageGrowth = 0;
        let speedGrowth = 0;
        let healingGrowth = 0;


        if(player.class === "TANK"){

            hpGrowth = 0.05;
            damageGrowth = 0.01;
            speedGrowth = 0.003;

        }


        else if(player.class === "WARRIOR"){

            hpGrowth = 0.06;
            damageGrowth = 0.01;
            speedGrowth = 0.003;

        }


        else if(player.class === "ARCHER"){

            hpGrowth = 0.02;
            damageGrowth = 0.015;
            speedGrowth = 0.01;

        }


        else if(player.class === "MAGE"){

            hpGrowth = 0.02;
            damageGrowth = 0.03;
            speedGrowth = 0.003;

        }


        else if(player.class === "PRIEST"){

            hpGrowth = 0.03;
            damageGrowth = 0;
            speedGrowth = 0.003;
            healingGrowth = 0.02;

        }


        /* =====================================
           ❤️ INCREASES HP
        ===================================== */

        const oldMaxHp =
            player.maxHp;


        player.maxHp =
            Math.floor(
                player.maxHp *
                (1 + hpGrowth)
            );


        const hpGain =
            player.maxHp -
            oldMaxHp;


        player.hp =
            Math.min(
                player.maxHp,
                player.hp + hpGain
            );


        /* =====================================
           ⚔️ INCREASES DAMAGE
        ===================================== */

        if(
            damageGrowth > 0 &&
            player.damage[0] > 0
        ){

            player.damage[0] =
                Math.floor(
                    player.damage[0] *
                    (1 + damageGrowth)
                );


            player.damage[1] =
                Math.floor(
                    player.damage[1] *
                    (1 + damageGrowth)
                );

        }


        /* =====================================
           ⚡ INCREASES ATTACK SPEED
           Lower number = faster
        ===================================== */

        if(speedGrowth > 0){

            player.speed =
                Math.max(
                    350,
                    Math.floor(
                        player.speed *
                        (1 - speedGrowth)
                    )
                );

        }


        /* =====================================
           ✝️ INCREASES HEALING POWER
        ===================================== */

        if(healingGrowth > 0){

            if(
                typeof player.healingPower !== "number"
            ){

                player.healingPower = 1;

            }

            player.healingPower *=
                (1 + healingGrowth);

        }


        /* =====================================
           ⭐ LEVEL UP NOTICE
        ===================================== */

        eventBox.textContent =
            "⭐ " +
            player.name +
            " reached LV." +
            player.level +
            "!";


        addEvent(
            "⭐ " +
            player.name +
            " → LV." +
            player.level
        );


        /* =====================================
           ✨ LEVEL UP EFFECT
        ===================================== */

        const playerElement =
            document.getElementById(
                "player-" + player.id
            );


        if(playerElement){

            const levelUpEffect =
                document.createElement("div");


            levelUpEffect.textContent =
                "⭐ LVL UP!";


            levelUpEffect.style.position =
                "absolute";


            levelUpEffect.style.left =
                "50%";


            levelUpEffect.style.top =
                "8px";


            levelUpEffect.style.transform =
                "translate(-50%, -50%) scale(.4)";


            levelUpEffect.style.color =
                "#ffd21c";


            levelUpEffect.style.fontSize =
                "12px";


            levelUpEffect.style.fontWeight =
                "900";


            levelUpEffect.style.whiteSpace =
                "nowrap";


            levelUpEffect.style.zIndex =
                "50";


            levelUpEffect.style.pointerEvents =
                "none";


            levelUpEffect.style.textShadow =
                "0 0 5px #fff, 0 0 12px #ffd21c, 0 0 25px #ffd21c";


            playerElement.appendChild(
                levelUpEffect
            );


            playerElement.animate(
                [
                    {
                        filter:
                            "brightness(1)"
                    },
                    {
                        filter:
                            "brightness(2)"
                    },
                    {
                        filter:
                            "brightness(1)"
                    }
                ],
                {
                    duration:700,
                    easing:"ease-out"
                }
            );


            levelUpEffect.animate(
                [
                    {
                        transform:
                            "translate(-50%, -50%) scale(.4)",
                        opacity:0
                    },
                    {
                        transform:
                            "translate(-50%, -70%) scale(1.3)",
                        opacity:1
                    },
                    {
                        transform:
                            "translate(-50%, -110%) scale(.9)",
                        opacity:0
                    }
                ],
                {
                    duration:1200,
                    easing:"ease-out"
                }
            );


            setTimeout(() => {

                levelUpEffect.remove();

            },1200);

        }

    }

}

/* ============================================================
   HEALER ACTION
============================================================ */

function healerAction(healer){

    if(!healer.alive){
        return;
    }

    /*
       A cura é decidida pelo Worker, para que
       todas as abas recebam o mesmo resultado.
    */

    if(
        multiplayerSocket.readyState !==
        WebSocket.OPEN
    ){
        return;
    }

    multiplayerSocket.send(
        JSON.stringify({
            type:"heal"
        })
    );

    return;

    const damaged =
        players.filter(
            p =>
                p.alive &&
                p.hp < p.maxHp
        );

    if(damaged.length === 0){
        return;
    }

    const target =
        damaged[
            Math.floor(
                Math.random() *
                damaged.length
            )
        ];

    /*
       Base healing.
       Starts small and grows very slowly
       with the Priest's level.
    */

    let heal =
        Math.floor(
            Math.random() * 16
        ) + 15;

    heal +=
        healer.level * 2;

    /*
       Healing power gained from level ups.
       Default value is 1 for existing players.
    */

    const healingPower =
        typeof healer.healingPower === "number"
            ? healer.healingPower
            : 1;

    heal =
        Math.floor(
            heal * healingPower
        );

    heal =
        Math.min(
            heal,
            target.maxHp - target.hp
        );

    if(heal <= 0){
        return;
    }

    target.hp +=
        heal;

    healer.healing +=
        heal;

    /* =====================================
       💚 HEALING EFFECT
    ===================================== */

    const targetElement =
        document.getElementById(
            "player-" + target.id
        );

    if(targetElement){

        const rect =
            targetElement.getBoundingClientRect();

        const healText =
            document.createElement("div");

        healText.textContent =
            "+" +
            heal +
            " HP";

        healText.style.position =
            "fixed";

        healText.style.left =
            (
                rect.left +
                rect.width / 2
            ) + "px";

        healText.style.top =
            (
                rect.top +
                rect.height / 2
            ) + "px";

        healText.style.transform =
            "translate(-50%, -50%)";

        healText.style.color =
            "#39ff88";

        healText.style.fontSize =
            "22px";

        healText.style.fontWeight =
            "900";

        healText.style.zIndex =
            "10005";

        healText.style.pointerEvents =
            "none";

        healText.style.textShadow =
            "0 0 5px white, 0 0 12px #00ff66";

        healText.style.transition =
            "top .8s ease-out, opacity .8s ease-out";

        document.body.appendChild(
            healText
        );

        requestAnimationFrame(() => {

            healText.style.top =
                (
                    rect.top -
                    10
                ) + "px";

            healText.style.opacity =
                "0";

        });

        setTimeout(() => {

            healText.remove();

        },800);

    }

    eventBox.textContent =
        "💚 " +
        healer.name +
        " HEALED " +
        target.name +
        " FOR +" +
        heal +
        " HP";

    gainXp(
        healer,
        Math.floor(
            heal * 0.5
        )
    );

    update();

       ✝️ PRIEST HEALING ANIMATION

        document.getElementById(
            "player-" + healer.id
        );

        healerElement.classList.remove(
            "healerCast"
        );

        void healerElement.offsetWidth;

            "healerCast"
        );

        setTimeout(() => {

            healerElement.classList.remove(

/* ============================================================
   RESSUSCITAR
============================================================ */

function revive(healer){

    if(!healer.alive){

        return;

    }


    const deadPlayers =
        players.filter(
            p => !p.alive
        );


    if(deadPlayers.length === 0){

        return;

    }


    /*
       45% chance.
    */

    if(Math.random() > 0.45){

        return;

    }


    const target =
        deadPlayers[
            Math.floor(
                Math.random() * deadPlayers.length
            )
        ];


    target.alive = true;

    target.hp =
        Math.floor(
            target.maxHp * 0.5
        );


    eventBox.textContent =
        "✝️ " +
        healer.name +
        " REVIVED " +
        target.name +
        "!";


    addEvent(
        "✝️ " +
        healer.name +
        " REVIVED " +
        target.name
    );


    update();


    /* =====================================
       ✝️ REVIVAL AURA
    ===================================== */

    const targetElement =
        document.getElementById(
            "player-" + target.id
        );


    if(targetElement){

        const aura =
            document.createElement("div");


        aura.style.position =
            "absolute";

        aura.style.left =
            "50%";

        aura.style.top =
            "50%";

        aura.style.width =
            "100%";

        aura.style.height =
            "100%";

        aura.style.transform =
            "translate(-50%, -50%)";

        aura.style.borderRadius =
            "50%";

        aura.style.pointerEvents =
            "none";

        aura.style.zIndex =
            "0";

        aura.style.boxShadow =
            "0 0 12px white, 0 0 25px white, 0 0 45px #ffffff";

        aura.style.background =
            "radial-gradient(circle, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.12) 45%, rgba(255,255,255,0) 75%)";


        targetElement.style.position =
            "relative";


        targetElement.appendChild(

        /*

        */

        aura.animate(

                }
            ],
            {

            }
        );


        setTimeout(() => {

            aura.remove();

        }, 1800);

    }

function bossAttack(){

    /*
       O navegador não calcula mais o ataque.
       Ele só pede o ataque; o Worker decide
       o resultado e o envia como bossAttackResult.
    */

    if(
        multiplayerSocket.readyState !==
        WebSocket.OPEN
    ){

        return;

    }

    if(battlePaused || bossHp <= 0){

        return;

    }

    multiplayerSocket.send(
        JSON.stringify({
            type:"bossAttack"
        })
    );

    return;

    if(bossHp <= 0){
        return;
    }

    if(battlePaused){
        return;
    }

    const alivePlayers =
        players.filter(
            p => p.alive
        );

    if(alivePlayers.length === 0){
        return;
    }

    /*
       🛡️ TAUNT
       If a player is taunting,
       the Boss must attack them.
    */

    const tauntPlayers =
        alivePlayers.filter(
            p => p.taunt === true
        );

    let target;

    if(tauntPlayers.length > 0){

        target =
            tauntPlayers[
                Math.floor(
                    Math.random() *
                    tauntPlayers.length
                )
            ];

    }
    else{

        /*
           🎯 TARGET CHANCE BY FORMATION
        */

        const targetWeights = {

            "TANK": 40,
            "WARRIOR": 25,
            "ARCHER": 18,
            "MAGE": 12,
            "PRIEST": 5

        };

        const weightedPlayers = [];

        alivePlayers.forEach(
            player => {

                const weight =
                    targetWeights[player.class] || 1;

                for(let i = 0; i < weight; i++){

                    weightedPlayers.push(
                        player
                    );

                }

            }
        );

        target =
            weightedPlayers[
                Math.floor(
                    Math.random() *
                    weightedPlayers.length
                )
            ];

    }

    /*
       🎯 BOSS SPELL
    */

    const spell =
        bossSpells[
            Math.floor(
                Math.random() *
                bossSpells.length
            )
        ];

    /*
       💥 BASE DAMAGE
       Damage increases with Boss level.
    */

    let damage =
        Math.floor(
            spell[2] *
            (
                1 +
                bossLevel * 0.10
            )
        );

    /*
       🔥 EXTRA DAMAGE FROM LEVEL 20+
    */

    if(bossLevel > 20){

        damage =
            Math.floor(
                damage *
                (
                    1 +
                    (bossLevel - 20) * 0.05
                )
            );

    }

    /*
       👑 SPECIAL BOSS
       +50% damage.
    */

    if(currentBoss.special){

        damage =
            Math.floor(
                damage * 1.5
            );

    }

    /*
       🔥 RAGE
       Below 25% HP:
       +50% damage.
    */

    if(bossHp <= maxBossHp * 0.25){

        damage =
            Math.floor(
                damage * 1.5
            );

    }

    /*
       🛡️ TANK DAMAGE REDUCTION
    */

    if(target.class === "TANK"){

        damage =
            Math.floor(
                damage * 0.65
            );

    }

    damage =
        Math.min(
            damage,
            target.hp
        );

    target.hp -= damage;

    /*
       💥 BOSS HIT SOUND
    */

    const bossHitSound =
        new Audio("golpeboss.mp3");

    bossHitSound.volume =
        0.9;

    bossHitSound.play()
        .catch(()=>{});

    /*
       💥 DAMAGE ON PLAYER
    */

    const targetElement =
        document.getElementById(
            "player-" + target.id
        );

    if(targetElement){

        const rect =
            targetElement.getBoundingClientRect();

        const damageText =
            document.createElement("div");

        damageText.className =
            "bossDamageNumber";

        damageText.textContent =
            "-" +
            damage;

        damageText.style.left =
            (
                rect.left +
                rect.width / 2
            ) + "px";

        damageText.style.top =
            (
                rect.top +
                rect.height / 2
            ) + "px";

        document.body.appendChild(
            damageText
        );

        setTimeout(()=>{

            damageText.remove();

        },800);

    }

    eventBox.textContent =
        spell[0] +
        " " +
        spell[1] +
        "! " +
        target.name +
        " lost " +
        damage +
        " HP";

    if(target.hp <= 0){

        killPlayer(target);

    }

    update();

}

function checkBossRage(){

    const percent =
        bossHp / maxBossHp;

    if(percent <= 0.25){

        /*
           Boss enters Rage mode.
        */

        const wasAlreadyRaging =
            bossElement.classList.contains("rage");

        bossElement.classList.add(
            "rage"
        );

        /*

                (index + 1) +
                ". " +
                p.icon +
                " " +
                p.name +
                " — " +
                p.totalDamage.toLocaleString("en-US")
        )
        .join("<br>");


    /* =====================================
       CRIA TOP HEALER
    ===================================== */

    let healerPanel =
        document.getElementById(
            "topHealerPanel"
        );


    if(!healerPanel){

        healerPanel =
            document.createElement("div");

        healerPanel.id =
            "topHealerPanel";

        healerPanel.className =
            "panel";

        healerPanel.innerHTML = `
            <div class="panelTitle">
                ✝️ TOP HEALER
            </div>

            <div
                class="panelText"
                id="healerRanking">
                —
            </div>
        `;

        panelGrid.appendChild(
            healerPanel
        );

    }


    /* =====================================
       TOP HEALER
    ===================================== */

    const healerRanking =
        [...players]
        .filter(
            p =>
                p.class === "PRIEST"
        )
        .sort(
            (a,b) =>
                b.healing - a.healing
        )
        .slice(0,5);


    const healerRankingElement =
        document.getElementById(
            "healerRanking"
        );


    if(healerRankingElement){

        healerRankingElement.innerHTML =
            healerRanking.length > 0

            ?

            healerRanking
            .map(
                (p,index) =>
                    (index + 1) +
                    ". " +
                    p.icon +
                    " " +
                    p.name +
                    " — " +
                    p.healing.toLocaleString("en-US")
            )
            .join("<br>")

            :

            "—";

    }

}


/* ============================================================
   UPDATE GERAL
============================================================ */

function update(){

    const percent =
        Math.max(
            0,
            bossHp / maxBossHp
        ) * 100;


    bossHpFill.style.width =
        percent + "%";


    bossHpText.textContent =
        bossHp.toLocaleString("en-US") +
        " / " +
        maxBossHp.toLocaleString("en-US") +
        " HP";


    bossLevelElement.textContent =
        "BOSS LEVEL " +
        bossLevel;


    bossNameElement.textContent =
        currentBoss.icon +
        " " +
        currentBoss.name;


    bossElement.textContent =
        currentBoss.icon;


    document.getElementById(
        "playerCount"
    ).textContent =
        players.length;


    document.getElementById(
        "bossStat"
    ).textContent =
        bossLevel;


    document.getElementById(
        "wins"
    ).textContent =
        wins;


    /*
       Update player HP and XP.
    */

    players.forEach(
        updatePlayerUI
    );


    /*
       Rebuild the formation only when
       something structural changed.
    */

    const formationKey =
        players.map(
            player =>
                player.id +
                ":" +
                player.class +
                ":" +
                player.alive
        ).join("|");


    if(
        window.lastFormationKey !==
        formationKey
    ){

        sortFormation();

        window.lastFormationKey =
            formationKey;

    }


    updateRanking();

    checkBossRage();


    if(bossHp <= 0){

        bossDefeated();

    }

}


/* ============================================================
   BOSS DEFEATED
============================================================ */

let bossEnding = false;


function bossDefeated(){

    if(bossEnding){
        return;
    }


    bossEnding = true;
    battlePaused = true;


    /* =====================================
       💀 BOSS DEATH SOUND
    ===================================== */

    const bossDeathSound =
        new Audio("monsterdeath.wav");

    bossDeathSound.volume =
        0.9;

    bossDeathSound.play()
        .catch(()=>{});


    wins++;


    /*
       Não gera o próximo Boss localmente.

       O servidor será responsável por
       definir o próximo Boss oficial.
    */


    /*
       Mostra imediatamente a prévia do próximo boss.
       O Worker confirma o boss oficial após o contador.
    */

    if(!window.nextBossPreview){

        window.nextBossPreview =
            generateBoss(
                bossLevel + 1
            );

    }

    victoryBoss.textContent =
        window.nextBossPreview.icon;

    const nextBattleTitle =
        document.getElementById("resultTitle");

    if(nextBattleTitle){

        nextBattleTitle.textContent =
            "⚔️ NEXT BATTLE!";

    }


    const nextBossNameElement =
        document.getElementById(
            "victoryNextBossName"
        );

    if(nextBossNameElement){

        nextBossNameElement.textContent =
            "NEXT BOSS";

    }


    /*
       Show victory screen.
    */

    victory.classList.add(
        "active"
    );

    flash.classList.add(
        "active"
    );


    addEvent(

        "🏆 " +
        currentBoss.name +
        " defeated!"

    );


    let countdown = 3;

    /* Cancela qualquer contador antigo antes de iniciar outro. */
    if(window.nextBossCountdownTimer){
        clearTimeout(window.nextBossCountdownTimer);
    }

    function showNextBossCountdown(){

        victoryText.textContent =
            "NEXT BOSS IN " +
            countdown;

        if(countdown === 1){

            window.nextBossCountdownTimer =
                setTimeout(() => {
                    window.nextBossCountdownTimer = null;
                    nextBoss();
                },1000);

            return;

        }

        countdown--;

        window.nextBossCountdownTimer =
            setTimeout(
                showNextBossCountdown,
                1000
            );

    }

    showNextBossCountdown();

}


/* ============================================================
   NEXT BOSS
============================================================ */

function nextBoss(){

    /*
       🌐 MULTIPLAYER

       O navegador não decide mais
       sozinho qual será o próximo boss.

       Ele apenas solicita a troca
       ao servidor.
    */

    if(
        multiplayerSocket.readyState !==
        WebSocket.OPEN
    ){

        return;

    }


    /*
       Só pode avançar quando
       o boss atual foi derrotado.
    */

    if(bossHp > 0){

        return;

    }


    /*
       Próximo nível.
    */

    const requestedBossLevel =
        bossLevel + 1;


    /*
       Geração temporária do boss.

       O servidor vai aceitar apenas
       o PRIMEIRO pedido válido.
    */

    let requestedBoss;


    if(window.nextBossPreview){

        requestedBoss =
            window.nextBossPreview;

        window.nextBossPreview =
            null;

    }else{

        requestedBoss =
            generateBoss(
                requestedBossLevel
            );

    }


    /*
       Envia pedido para o servidor.
    */

    multiplayerSocket.send(

        JSON.stringify({

            type:
                "nextBoss",

            bossLevel:
                requestedBossLevel,

            currentBoss:
                requestedBoss,

            maxBossHp:
                requestedBoss.hp,

            bossHp:
                requestedBoss.hp

        })

    );


    console.log(

        "🌐 NEXT BOSS REQUEST SENT:",

        requestedBossLevel,

        requestedBoss.name

    );

}


/* ============================================================
   AUTOMATIC PLAYER ENTRY
============================================================ */

function startPlayerEntries(){

    /*
       🌐 MULTIPLAYER

       Cada navegador representa
       apenas 1 jogador.
    */

    if(players.length >= 1){
        return;
    }


    createPlayer();

}


/* ============================================================
   AUTOMATIC ATTACKS
============================================================ */

function startPlayerAI(player){

    function nextAction(){

        if(!player.alive){

            setTimeout(
                nextAction,
                500
            );

            return;

        }


        if(battlePaused){

            setTimeout(
                nextAction,
                500
            );

            return;

        }


        if(player.class === "PRIEST"){

            healerAction(player);

        }else{

            playerAttack(player);

        }


        setTimeout(
            nextAction,
            player.speed
        );

    }


    setTimeout(
        nextAction,
        player.speed
    );

}



/* =========================================
   AUTOMATIC SKILL TEST
========================================= */

/* =========================================
   🎯 AUTOMATIC SKILL TEST
   One skill at a time, at a random interval
========================================= */

function testRandomSkill(){

    /*
       🌐 MULTIPLAYER

       A skill agora é decidida
       pelo servidor.

       O navegador apenas solicita
       uma nova skill.
    */

    if(
        multiplayerSocket.readyState !==
        WebSocket.OPEN
    ){

        return;

    }


    if(battlePaused){

        return;

    }


    multiplayerSocket.send(

        JSON.stringify({

            type:
                "skill"

        })

    );


    console.log(
        "✨ SKILL REQUEST SENT"
    );

}


/* =========================================
   ⏱️ NEXT SKILL
   Entre 3 e 7 segundos
========================================= */

function scheduleNextSkill(){

    const delay =
        Math.floor(
            Math.random() * 4000
        ) + 3000;


    setTimeout(()=>{

        /*
           Executes the next skill.
        */

        try{

            testRandomSkill();

        }catch(error){

            console.error(
                "Skill error:",
                error
            );

        }


        /*
           Even if a skill fails,
           schedule the next one.
        */

        scheduleNextSkill();

    },delay);

}


/*
   Os testes automáticos locais ficam desligados.
   Habilidades reais chegarão da Twitch pelo Worker.
*/

const LOCAL_TEST_MODE = false;

if(LOCAL_TEST_MODE){
    scheduleNextSkill();
}


let bossAttackTimer = null;

function scheduleBossAttack(){

    if(bossAttackTimer){
        clearTimeout(
            bossAttackTimer
        );
    }

    /*
       Base attack interval:
       5 seconds.

       Higher Boss levels become faster.
    */

    let attackSpeed =
        5000 -
        (bossLevel - 1) * 40;

    /*
       Minimum normal attack interval.
    */

    attackSpeed =
        Math.max(
            2500,
            attackSpeed
        );

    /*
       🔥 RAGE
       Below 25% HP:
       Boss attacks 30% faster.
    */

    if(
        bossHp <= maxBossHp * 0.25
    ){

        attackSpeed =
            Math.floor(
                attackSpeed * 0.70
            );

    }

    bossAttackTimer =
        setTimeout(() => {

            bossAttack();

            scheduleBossAttack();

        }, attackSpeed);

}


/*
   Start the Boss attack cycle.
*/

scheduleBossAttack();


/* ============================================================
   INITIALIZATION
============================================================ */

if(LOCAL_TEST_MODE){
    startPlayerEntries();
}


/*
   Creates the AI for each player
   when they join.
*/

if(LOCAL_TEST_MODE){

setInterval(()=>{

    players.forEach(player => {

        if(player.aiStarted){
            return;
        }


        startPlayerAI(player);


        player.aiStarted = true;

    });

},500);

}


/* ============================================================
   FIRST UPDATE
============================================================ */

update();

</script>
